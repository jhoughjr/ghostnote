name: build

# The forge pull mirror runs this workflow. It must live here on GitHub, because the mirror deletes a path that the source does not carry.
# The engine imports AppKit, so the job runs on the mini's macOS host and not in the Linux container.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: swift build

      - name: test
        run: swift test
