name: build

# The forge pull mirror runs this workflow. It must live here on GitHub, because the mirror deletes a path that the source does not carry.
# Replace the check step with the Swift build when the engine package exists.
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, linux, arm64]
    container: roost-ci:arm64
    steps:
      - uses: actions/checkout@v4

      - name: check
        run: git log -1 --oneline
